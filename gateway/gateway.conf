# API Gateway: the only container reachable from outside docker.
# Receives HTTPS on port 8443 and forwards each path to the right service,
# again over HTTPS, checking the service's certificate against our CA.

# ---------------------------------------------------------------------------
# Upstreams: one block per service. The name after "server" is the service
# name from docker-compose.yml (docker's DNS turns it into the container IP).
#
# Only add a service here once it exists in docker-compose.yml, otherwise nginx
# refuses to start with "host not found in upstream".
# ---------------------------------------------------------------------------
upstream monsters {
    server monsters:5002;
}

upstream account { 
    server account:5000; 
}

upstream encounter {
    server encounter:5003;
}

upstream ownership {
    server ownership:5001;
}

upstream historian {
    server historian:5004;
}


server {
    listen 8443 ssl;
    server_name localhost;

    # The gateway's own certificate (what the frontend and curl see).
    ssl_certificate     /certs/service.crt;
    ssl_certificate_key /certs/service.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Calls from the gateway to the services also use HTTPS, and the gateway
    # checks each service's certificate was signed by our CA and matches its name.
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify_depth        2;
    proxy_ssl_server_name         on;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;

    # Pass the original client info and the Authorization header to the service.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Nobody needs to upload big files to a monster game.
    client_max_body_size 1m;

    # Hide the nginx version in error pages and headers.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Internal endpoints are for service-to-service calls only. Players must
    # never reach them, so the gateway answers 404 before forwarding anything.
    # -----------------------------------------------------------------------
    location ^~ /internal/ {
        default_type application/json;
        return 404 '{"error":"not_found","message":"Not found."}';
    }

    # The gateway's own health check.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # -----------------------------------------------------------------------
    # Routes: path prefix -> service. See docs/openapi/README.md for the table.
    # -----------------------------------------------------------------------
    location /monsters {
        proxy_pass https://monsters;
    }
    
    location /auth {
        proxy_pass https://account;
    }

    location /me {
        proxy_pass https://account;
    }

    location /collection {
        proxy_pass https://ownership;
    }

    location /teams {
        proxy_pass https://ownership;
    }

    location /encounters {
        proxy_pass https://encounter;
    }

    location /runs {
        proxy_pass https://encounter;
    }

    location /history {
        proxy_pass https://historian;
    }

    # Anything else: 404 in the same JSON format as the services.
    location / {
        default_type application/json;
        return 404 '{"error":"not_found","message":"Not found."}';
    }
}
